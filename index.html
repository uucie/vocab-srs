<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>単語帳SRS — 準1級ボキャブラリー</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B3A55">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --paper:#F7F3EC;
    --ink:#24232A;
    --navy:#2B3A55;
    --navy-2:#3C4F73;
    --coral:#E2654A;
    --coral-dark:#C6512C;
    --sage:#6F8F6B;
    --gold:#D9A441;
    --line:#E4DCC9;
    --card:#FFFFFF;
    --shadow: 0 2px 10px rgba(43,58,85,0.08), 0 1px 2px rgba(43,58,85,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:24px;
  }
  .wrap{max-width:520px;margin:0 auto;padding:0 16px;}
  header.top{
    background:var(--navy);
    color:#fff;
    padding:22px 16px 20px;
    border-radius:0 0 22px 22px;
    box-shadow:var(--shadow);
    margin-bottom:18px;
    position:relative;
  }
  header.top .reset-link{
    position:absolute;top:20px;right:16px;
    background:rgba(255,255,255,0.14);color:#fff;border:none;
    font-size:11.5px;padding:6px 10px;border-radius:20px;cursor:pointer;font-family:inherit;
  }
  header.top .eyebrow{
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:#B9C4DA;margin-bottom:4px;font-weight:600;
  }
  header.top h1{
    font-family:Georgia,"Times New Roman",serif;
    font-size:24px;margin:0;font-weight:700;letter-spacing:.01em;
  }
  header.top .sub{font-size:12.5px;color:#C9D2E4;margin-top:6px;line-height:1.5;}

  .screen{display:none;}
  .screen.active{display:block;}

  /* ---- checkbox signature element ---- */
  .box-icon{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;border:2px solid var(--navy);border-radius:4px;
    flex-shrink:0;font-size:13px;color:transparent;
  }
  .box-icon.new{border-color:#C9BFA3;background:transparent;}
  .box-icon.learning{border-color:var(--gold);background:rgba(217,164,65,0.18);}
  .box-icon.mastered{border-color:var(--sage);background:var(--sage);color:#fff;}
  .box-icon.locked{border-color:#D8D2C0;background:repeating-linear-gradient(45deg,#F0EBDD,#F0EBDD 3px,#E9E3D3 3px,#E9E3D3 6px);}
  .dual-icons{display:flex;gap:8px;}
  .di{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .di-label{font-size:9px;color:#8A8474;}

  /* ---- stat cards ---- */
  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  .stat-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 14px;box-shadow:var(--shadow);
  }
  .stat-card .n{font-family:Georgia,serif;font-size:26px;font-weight:700;color:var(--navy);line-height:1;}
  .stat-card .l{font-size:12px;color:#6B6558;margin-top:6px;}

  .progress-bar{
    height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0 18px;
  }
  .progress-bar > div{height:100%;background:var(--sage);border-radius:6px;transition:width .4s ease;}

  .btn{
    display:block;width:100%;text-align:center;padding:15px 18px;border-radius:14px;
    border:none;font-size:15.5px;font-weight:700;cursor:pointer;
    font-family:inherit;letter-spacing:.01em;
  }
  .btn-primary{background:var(--coral);color:#fff;box-shadow:0 4px 12px rgba(226,101,74,0.35);}
  .btn-primary:active{background:var(--coral-dark);}
  .btn-secondary{background:var(--card);color:var(--navy);border:1.5px solid var(--navy);}
  .btn-ghost{background:transparent;color:#8A8474;font-weight:600;font-size:13px;padding:8px;}
  .btn-row{display:flex;gap:10px;margin-top:10px;}
  .btn-row .btn{flex:1;}

  section.block{margin-bottom:20px;}
  section.block h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#8A8474;margin:0 0 10px;font-weight:700;}

  /* ---- browse list ---- */
  .search{
    width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--card);font-size:15px;margin-bottom:12px;font-family:inherit;
  }
  .word-row{
    display:flex;align-items:center;gap:10px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;
    cursor:pointer;
  }
  .word-row .wtext{flex:1;min-width:0;}
  .word-row .en{font-family:Georgia,serif;font-weight:700;font-size:16px;color:var(--navy);}
  .word-row .pos{font-size:10.5px;color:#fff;background:var(--navy-2);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
  .word-row .jp{font-size:13px;color:#5B5648;margin-top:2px;}
  .word-detail{
    display:none;margin-top:8px;padding-top:10px;border-top:1px dashed var(--line);
  }
  .word-detail.open{display:block;}
  .word-detail .ex{font-size:14px;color:var(--ink);margin-bottom:4px;}
  .word-detail .exja{font-size:12.5px;color:#8A8474;}
  .speak-btn{
    display:inline-flex;align-items:center;gap:4px;background:var(--navy);color:#fff;
    border:none;border-radius:20px;padding:6px 12px;font-size:12.5px;margin-top:8px;cursor:pointer;
  }

  /* ---- study card ---- */
  .card-area{margin-top:8px;}
  .flash{
    background:var(--card);border-radius:20px;box-shadow:var(--shadow);
    border:1px solid var(--line);padding:34px 22px;text-align:center;min-height:260px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .flash .pos-tag{
    font-size:11px;background:var(--navy);color:#fff;border-radius:8px;padding:2px 9px;
    display:inline-block;margin-bottom:14px;letter-spacing:.04em;
  }
  .flash .word{font-family:Georgia,serif;font-size:32px;font-weight:700;color:var(--navy);word-break:break-word;}
  .flash .meaning{font-size:20px;margin-top:14px;color:var(--coral-dark);font-weight:700;display:none;}
  .flash .example{font-size:15px;margin-top:18px;color:var(--ink);line-height:1.6;display:none;}
  .flash .exampleja{font-size:13px;margin-top:4px;color:#8A8474;display:none;}
  .flash.revealed .meaning,.flash.revealed .example,.flash.revealed .exampleja{display:block;}
  .speak-row{margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}

  .reveal-btn{margin-top:22px;}

  .rate-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px;}
  .rate-btn{
    padding:13px 4px;border-radius:12px;border:none;font-size:12.5px;font-weight:700;color:#fff;cursor:pointer;
  }
  .rate-again{background:#B8523A;}
  .rate-hard{background:var(--gold);}
  .rate-good{background:var(--sage);}
  .rate-easy{background:var(--navy);}
  .rate-btn .sub{display:block;font-weight:400;font-size:10px;opacity:.85;margin-top:2px;}

  .queue-status{font-size:12.5px;color:#8A8474;text-align:center;margin-top:14px;}

  .empty-state{
    text-align:center;padding:50px 20px;color:#8A8474;
  }
  .empty-state .box-icon{width:40px;height:40px;font-size:24px;margin-bottom:14px;}

  nav.tabbar{
    position:fixed;bottom:0;left:0;right:0;background:var(--card);
    border-top:1px solid var(--line);display:flex;padding:6px 10px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 10px rgba(43,58,85,0.06);
  }
  nav.tabbar button{
    flex:1;background:none;border:none;font-family:inherit;font-size:11.5px;color:#8A8474;
    padding:8px 2px 4px;cursor:pointer;font-weight:600;
  }
  nav.tabbar button.active{color:var(--coral-dark);}
  nav.tabbar button .ic{display:block;font-size:19px;margin-bottom:2px;}
  main{padding-bottom:140px;}
  #screen-browse{padding-bottom:60px;}
  #screen-home{padding-bottom:40px;}

  .modal-bg{
    display:none;position:fixed;inset:0;background:rgba(36,35,42,0.45);z-index:10;
    align-items:flex-end;justify-content:center;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--paper);width:100%;max-width:520px;border-radius:20px 20px 0 0;
    padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:80vh;overflow-y:auto;
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <button class="reset-link" id="btn-reset">進捗をリセット</button>
    <div class="eyebrow">Vocabulary SRS</div>
    <h1>もっと！単語帳</h1>
    <div class="sub">エビングハウスの忘却曲線（1→2→4→7→15→30→90日）に沿って復習します。</div>
  </header>
</div>

<main class="wrap">

  <!-- HOME -->
  <section id="screen-home" class="screen active">

    <section class="block">
      <h2>読み（英語→日本語）</h2>
      <div class="stat-grid">
        <div class="stat-card"><div class="n" id="r-due">0</div><div class="l">今日の復習</div></div>
        <div class="stat-card"><div class="n" id="r-new">0</div><div class="l">未学習</div></div>
        <div class="stat-card"><div class="n" id="r-mastered">0</div><div class="l">定着</div></div>
        <div class="stat-card"><div class="n" id="r-total">0</div><div class="l">総単語数</div></div>
      </div>
      <div class="progress-bar"><div id="r-progress-fill" style="width:0%"></div></div>
      <button class="btn btn-primary" id="btn-start-recognize">読んで覚える</button>
    </section>

    <section class="block">
      <h2>書き（日本語→英語つづり）</h2>
      <div class="stat-grid">
        <div class="stat-card"><div class="n" id="s-due">0</div><div class="l">今日の復習</div></div>
        <div class="stat-card"><div class="n" id="s-new">0</div><div class="l">未学習</div></div>
        <div class="stat-card"><div class="n" id="s-mastered">0</div><div class="l">定着</div></div>
        <div class="stat-card"><div class="n" id="s-locked">0</div><div class="l">読み未習得</div></div>
      </div>
      <div class="progress-bar"><div id="s-progress-fill" style="width:0%"></div></div>
      <div id="s-lock-note" style="font-size:12.5px;color:#8A8474;margin:-10px 0 10px;"></div>
      <button class="btn btn-primary" id="btn-start-spell" style="background:var(--navy);">書いて覚える</button>
    </section>

    <div class="btn-row">
      <button class="btn btn-secondary" id="btn-goto-browse">単語一覧を見る</button>
    </div>
  </section>

  <!-- STUDY -->
  <section id="screen-study" class="screen">
    <div id="study-body"></div>
  </section>

  <!-- BROWSE -->
  <section id="screen-browse" class="screen">
    <input class="search" id="search-input" placeholder="英単語・意味で検索…">
    <div id="browse-list"></div>
  </section>

</main>

<nav class="tabbar">
  <button data-screen="home" class="tab-btn active"><span class="ic">🏠</span>ホーム</button>
  <button data-screen="study" class="tab-btn"><span class="ic">📇</span>学習</button>
  <button data-screen="browse" class="tab-btn"><span class="ic">🔍</span>一覧</button>
</nav>

<script>
/* ============ 単語データ ============ */
const WORDS = [
{w:"avoidance",pos:"名",m:"回避",ex:"Avoidance of the topic made everyone suspicious.",exja:"その話題を避けたことで皆が怪しんだ。"},
{w:"apply",pos:"動",m:"申し込む、適用する",ex:"You can apply for the scholarship online.",exja:"その奨学金にはオンラインで申し込める。"},
{w:"collide",pos:"動",m:"衝突する",ex:"The two cars collided at the intersection.",exja:"二台の車が交差点で衝突した。"},
{w:"collision",pos:"名",m:"衝突",ex:"The collision caused minor injuries.",exja:"衝突で軽傷者が出た。"},
{w:"compensate",pos:"動",m:"補償する",ex:"The company compensated him for the loss.",exja:"会社は彼の損失を補償した。"},
{w:"compensation",pos:"名",m:"補償",ex:"She received compensation for the damage.",exja:"彼女は損害への補償を受けた。"},
{w:"complaint",pos:"名",m:"苦情",ex:"He filed a complaint about the noise.",exja:"彼は騒音について苦情を申し立てた。"},
{w:"complain",pos:"動",m:"不満を言う",ex:"Stop complaining and start working.",exja:"文句を言うのをやめて働き始めなさい。"},

{w:"consequent",pos:"形",m:"結果として起こる",ex:"The flood and its consequent damage were severe.",exja:"洪水とその結果生じた被害は深刻だった。"},
{w:"consistent",pos:"形",m:"一貫した",ex:"Try to be consistent with your schedule.",exja:"スケジュールに一貫性を持たせるようにしなさい。"},
{w:"consistency",pos:"名",m:"一貫性",ex:"The report lacks consistency.",exja:"その報告書には一貫性が欠けている。"},

{w:"detention",pos:"名",m:"拘留",ex:"He was held in detention for a week.",exja:"彼は一週間拘留された。"},

{w:"exist",pos:"動",m:"存在する",ex:"Does life exist on other planets?",exja:"他の惑星に生命は存在するのか。"},
{w:"existence",pos:"名",m:"存在",ex:"The company has been in existence for decades.",exja:"その会社は数十年存在し続けている。"},
{w:"expose",pos:"動",m:"さらす、暴く",ex:"The report exposed the truth.",exja:"その報道が真実を暴いた。"},
{w:"exposure",pos:"名",m:"露出",ex:"Long exposure to the sun is harmful.",exja:"長時間日光にさらされるのは有害だ。"},
{w:"immigrate",pos:"動",m:"移住する",ex:"They immigrated to Canada last year.",exja:"彼らは昨年カナダに移住した。"},
{w:"immigrant",pos:"名",m:"移民",ex:"Many immigrants work in this city.",exja:"多くの移民がこの街で働いている。"},
{w:"regulate",pos:"動",m:"規制する",ex:"The government regulates food safety.",exja:"政府は食品安全を規制している。"},
{w:"regulation",pos:"名",m:"規制",ex:"New regulations were introduced.",exja:"新しい規制が導入された。"},
{w:"reside",pos:"動",m:"住む",ex:"She resides in a small village.",exja:"彼女は小さな村に住んでいる。"},
{w:"residential",pos:"形",m:"住宅の",ex:"This is a quiet residential area.",exja:"ここは静かな住宅地だ。"},
{w:"resident",pos:"名",m:"住民",ex:"Local residents opposed the plan.",exja:"地元住民はその計画に反対した。"},

{w:"bankruptcy",pos:"名",m:"倒産",ex:"The store filed for bankruptcy.",exja:"その店は倒産を申請した。"},
{w:"debris",pos:"名",m:"破片",ex:"Debris covered the street after the storm.",exja:"嵐の後、道路は破片で覆われた。"},
{w:"hydrogen",pos:"名",m:"水素",ex:"Hydrogen is the lightest element.",exja:"水素は最も軽い元素だ。"},
{w:"infrastructure",pos:"名",m:"基盤、インフラ",ex:"The city needs better infrastructure.",exja:"この市はより良いインフラを必要としている。"},
{w:"irrigation",pos:"名",m:"灌漑",ex:"Irrigation helps crops grow in dry areas.",exja:"灌漑は乾燥地で作物の成長を助ける。"},
{w:"sanction",pos:"名",m:"制裁",ex:"The country faced economic sanctions.",exja:"その国は経済制裁を受けた。"},
{w:"revenue",pos:"名",m:"収入、歳入",ex:"The company's revenue increased this year.",exja:"今年会社の収入は増加した。"},
{w:"veterinarian",pos:"名",m:"獣医",ex:"The veterinarian examined my dog.",exja:"獣医が私の犬を診察した。"},
{w:"bankrupt",pos:"形",m:"倒産した",ex:"The business went bankrupt last year.",exja:"その会社は昨年倒産した。"},
{w:"beneficial",pos:"形",m:"有益な",ex:"Exercise is beneficial to health.",exja:"運動は健康に有益だ。"},
{w:"decisive",pos:"形",m:"決定的な",ex:"She took decisive action.",exja:"彼女は決定的な行動を取った。"},
{w:"flexible",pos:"形",m:"柔軟な",ex:"My work hours are flexible.",exja:"私の勤務時間は柔軟だ。"},

{w:"spacious",pos:"形",m:"広々とした",ex:"They live in a spacious apartment.",exja:"彼らは広々とした部屋に住んでいる。"},
{w:"vigorous",pos:"形",m:"活発な",ex:"He does vigorous exercise every morning.",exja:"彼は毎朝活発な運動をする。"},
{w:"clinical",pos:"形",m:"臨床の",ex:"The drug passed clinical trials.",exja:"その薬は臨床試験に合格した。"},

{w:"disabled",pos:"形",m:"障がいを持った",ex:"The building has access for disabled people.",exja:"その建物には障がい者用の入口がある。"},
{w:"extraordinary",pos:"形",m:"並外れた",ex:"She has extraordinary talent.",exja:"彼女は並外れた才能を持つ。"},
{w:"illegal",pos:"形",m:"違法の",ex:"Parking here is illegal.",exja:"ここに駐車するのは違法だ。"},

/* ============ 復習間隔（エビングハウス風）============ */
const DAYS = [1,2,4,7,15,30,90]; // box 0..6 の次回間隔（日）
const MASTER_BOX = 4; // これ以上を「定着」とみなす
const SPELL_UNLOCK_BOX = MASTER_BOX; // 読みがこの段階に達したら書き練習が解禁される
const DAY_MS = 24*60*60*1000;
const NEW_PER_SESSION = 15;

let progress = {}; // { id: { recognize:{box,due,reps}, spell:{box,due,reps} } }
let queue = [];
let currentCard = null;
let currentRevealed = false;

/* ============ ストレージ（localStorage） ============ */
const STORAGE_KEY = 'vocab-srs-progress-v2';
function loadProgress(){
  try{
    const v = localStorage.getItem(STORAGE_KEY);
    progress = v ? JSON.parse(v) : {};
  }catch(e){ progress = {}; }
}
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }
  catch(e){ console.error('storage save failed', e); }
}

/* ============ SRS ロジック（読み／書きを別管理） ============ */
function getP(id, mode){ const c = progress[id]; return c ? c[mode] : undefined; }
function isNew(id, mode){ return !getP(id, mode); }
function isDue(id, mode){ const p = getP(id, mode); return p && p.due <= Date.now(); }
function isMastered(id, mode){ const p = getP(id, mode); return p && p.box >= MASTER_BOX; }
function isUnlockedForSpell(id){ return isMastered(id, 'recognize'); }

function rate(id, mode, grade){
  if(!progress[id]) progress[id] = {};
  let p = progress[id][mode] || {box:0, due:0, reps:0};
  p.reps = (p.reps||0)+1;
  if(grade==='again'){ p.box = 0; p.due = Date.now(); }
  else if(grade==='hard'){ p.due = Date.now() + DAYS[p.box]*DAY_MS; }
  else if(grade==='good'){ p.box = Math.min(p.box+1, DAYS.length-1); p.due = Date.now() + DAYS[p.box]*DAY_MS; }
  else if(grade==='easy'){ p.box = Math.min(p.box+2, DAYS.length-1); p.due = Date.now() + DAYS[p.box]*DAY_MS; }
  progress[id][mode] = p;
  saveProgress();
}

function buildQueue(mode){
  const pool = mode==='spell' ? WORDS.filter(c=>isUnlockedForSpell(c.id)) : WORDS;
  const due = pool.filter(c=>isDue(c.id, mode)).map(c=>c.id);
  const news = pool.filter(c=>isNew(c.id, mode)).map(c=>c.id).slice(0, NEW_PER_SESSION);
  // shuffle due lightly
  for(let i=due.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [due[i],due[j]]=[due[j],due[i]]; }
  queue = due.concat(news);
}

/* ============ 音声読み上げ ============ */
function speak(text, lang){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || 'en-US';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}

/* ============ 画面切替 ============ */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.screen===name));
  if(name==='home') renderHome();
  if(name==='browse') renderBrowse();
}

/* ============ ホーム ============ */
function renderHome(){
  const total = WORDS.length;

  // 読み
  const rDue = WORDS.filter(c=>isDue(c.id,'recognize')).length;
  const rNew = WORDS.filter(c=>isNew(c.id,'recognize')).length;
  const rMastered = WORDS.filter(c=>isMastered(c.id,'recognize')).length;
  document.getElementById('r-due').textContent = rDue;
  document.getElementById('r-new').textContent = rNew;
  document.getElementById('r-mastered').textContent = rMastered;
  document.getElementById('r-total').textContent = total;
  document.getElementById('r-progress-fill').style.width = Math.round(rMastered/total*100)+'%';

  // 書き（読みが定着した単語だけが対象）
  const unlocked = WORDS.filter(c=>isUnlockedForSpell(c.id));
  const sLocked = total - unlocked.length;
  const sDue = unlocked.filter(c=>isDue(c.id,'spell')).length;
  const sNew = unlocked.filter(c=>isNew(c.id,'spell')).length;
  const sMastered = unlocked.filter(c=>isMastered(c.id,'spell')).length;
  document.getElementById('s-due').textContent = sDue;
  document.getElementById('s-new').textContent = sNew;
  document.getElementById('s-mastered').textContent = sMastered;
  document.getElementById('s-locked').textContent = sLocked;
  document.getElementById('s-progress-fill').style.width = Math.round(sMastered/total*100)+'%';

  const note = document.getElementById('s-lock-note');
  note.textContent = sLocked>0
    ? `読みが定着した単語から書き練習に追加されます（あと${sLocked}語）`
    : 'すべての単語が書き練習の対象です。';
}

/* ============ 学習画面 ============ */
let studyMode = 'recognize'; // 'recognize'=英→日, 'spell'=日→英（つづり）

function startStudy(mode){
  studyMode = mode;
  buildQueue(mode);
  showScreen('study');
  nextCard();
}

function nextCard(){
  currentRevealed = false;
  if(queue.length===0){
    if(studyMode==='spell' && WORDS.filter(c=>isUnlockedForSpell(c.id)).length===0){
      document.getElementById('study-body').innerHTML =
        '<div class="empty-state"><div class="box-icon locked">🔒</div>' +
        '<div style="font-size:16px;font-weight:700;color:var(--navy);margin-bottom:6px;">まだ書ける単語がありません</div>' +
        '<div>先に「読んで覚える」で単語を定着させましょう。</div></div>' +
        '<button class="btn btn-secondary" style="margin-top:18px;" onclick="showScreen(\'home\')">ホームに戻る</button>';
    } else {
      document.getElementById('study-body').innerHTML =
        '<div class="empty-state"><div class="box-icon mastered">✓</div>' +
        '<div style="font-size:16px;font-weight:700;color:var(--navy);margin-bottom:6px;">今日の学習は完了です</div>' +
        '<div>また時間をおいて復習しましょう。</div></div>' +
        '<button class="btn btn-secondary" style="margin-top:18px;" onclick="showScreen(\'home\')">ホームに戻る</button>';
    }
    return;
  }
  currentCard = queue[0];
  const c = WORDS[currentCard];
  const remaining = queue.length;

  if(studyMode==='spell'){
    document.getElementById('study-body').innerHTML = `
      <div class="card-area">
        <div class="flash" id="flash">
          <span class="pos-tag">${c.pos}</span>
          <div class="word" style="font-size:24px;">${c.m}</div>
          <input type="text" id="spell-input" class="search" style="margin-top:18px;text-align:center;font-size:17px;"
                 placeholder="英単語のつづりを入力" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
          <div id="spell-feedback" style="margin-top:10px;font-weight:700;"></div>
          <div class="word" id="spell-answer" style="display:none;margin-top:6px;">${c.w}</div>
          <div class="example">${c.ex}</div>
          <div class="exampleja">${c.exja}</div>
          <div class="speak-row" id="spell-speak" style="display:none;">
            <button class="speak-btn" onclick="speak('${escAttr(c.w)}','en-US')">🔊 単語</button>
            <button class="speak-btn" onclick="speak('${escAttr(c.ex)}','en-US')">🔊 例文</button>
          </div>
          <button class="btn btn-primary reveal-btn" id="check-btn">答え合わせ</button>
        </div>
        <div class="rate-grid" id="rate-grid" style="display:none;">
          <button class="rate-btn rate-again" onclick="answer('again')">もう一度<span class="sub">今日中に再出題</span></button>
          <button class="rate-btn rate-hard" onclick="answer('hard')">いまいち<span class="sub">同じ間隔</span></button>
          <button class="rate-btn rate-good" onclick="answer('good')">できた<span class="sub">次は${nextIntervalLabel('good')}</span></button>
          <button class="rate-btn rate-easy" onclick="answer('easy')">簡単<span class="sub">次は${nextIntervalLabel('easy')}</span></button>
        </div>
        <div class="queue-status">残り ${remaining} 枚（つづり練習）</div>
      </div>`;
    document.getElementById('check-btn').addEventListener('click', checkSpelling);
    const input = document.getElementById('spell-input');
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); checkSpelling(); } });
    setTimeout(()=>input.focus(), 50);
  } else {
    document.getElementById('study-body').innerHTML = `
      <div class="card-area">
        <div class="flash" id="flash">
          <span class="pos-tag">${c.pos}</span>
          <div class="word">${c.w}</div>
          <div class="meaning">${c.m}</div>
          <div class="example">${c.ex}</div>
          <div class="exampleja">${c.exja}</div>
          <div class="speak-row">
            <button class="speak-btn" onclick="speak('${escAttr(c.w)}','en-US')">🔊 単語</button>
            <button class="speak-btn" onclick="speak('${escAttr(c.ex)}','en-US')">🔊 例文</button>
          </div>
          <button class="btn btn-primary reveal-btn" id="reveal-btn">意味を見る</button>
        </div>
        <div class="rate-grid" id="rate-grid" style="display:none;">
          <button class="rate-btn rate-again" onclick="answer('again')">もう一度<span class="sub">今日中に再出題</span></button>
          <button class="rate-btn rate-hard" onclick="answer('hard')">いまいち<span class="sub">同じ間隔</span></button>
          <button class="rate-btn rate-good" onclick="answer('good')">できた<span class="sub">次は${nextIntervalLabel('good')}</span></button>
          <button class="rate-btn rate-easy" onclick="answer('easy')">簡単<span class="sub">次は${nextIntervalLabel('easy')}</span></button>
        </div>
        <div class="queue-status">残り ${remaining} 枚</div>
      </div>`;
    document.getElementById('reveal-btn').addEventListener('click', reveal);
  }
}

function normalizeSpelling(s){
  return s.toLowerCase().trim().replace(/\s+/g,' ');
}

function checkSpelling(){
  const c = WORDS[currentCard];
  const input = document.getElementById('spell-input');
  const userVal = normalizeSpelling(input.value);
  const correctVal = normalizeSpelling(c.w);
  const isCorrect = userVal === correctVal;
  input.disabled = true;
  document.getElementById('spell-answer').style.display='block';
  document.getElementById('spell-speak').style.display='flex';
  document.getElementById('flash').classList.add('revealed');
  const fb = document.getElementById('spell-feedback');
  if(isCorrect){
    fb.textContent = '正解！';
    fb.style.color = 'var(--sage)';
  } else {
    fb.textContent = '不正解（正しいつづり ↓）';
    fb.style.color = 'var(--coral-dark)';
  }
  document.getElementById('check-btn').style.display='none';
  document.getElementById('rate-grid').style.display='grid';
  currentRevealed = true;
}

function nextIntervalLabel(grade){
  const p = getP(currentCard, studyMode) || {box:0};
  let box = p.box;
  if(grade==='good') box = Math.min(box+1, DAYS.length-1);
  if(grade==='easy') box = Math.min(box+2, DAYS.length-1);
  return DAYS[box]+'日後';
}

function reveal(){
  currentRevealed = true;
  document.getElementById('flash').classList.add('revealed');
  document.getElementById('reveal-btn').style.display='none';
  document.getElementById('rate-grid').style.display='grid';
}

function answer(grade){
  if(!currentRevealed) return;
  rate(currentCard, studyMode, grade);
  if(grade==='again'){
    queue.shift();
    const pos = Math.min(3, queue.length);
    queue.splice(pos,0,currentCard);
  } else {
    queue.shift();
  }
  nextCard();
}

function escAttr(s){ return s.replace(/'/g, "\\'").replace(/"/g,'&quot;'); }

/* ============ 一覧画面 ============ */
function renderBrowse(filter){
  filter = (filter||'').trim().toLowerCase();
  const list = WORDS.filter(c=>{
    if(!filter) return true;
    return c.w.toLowerCase().includes(filter) || c.m.includes(filter);
  });
  const el = document.getElementById('browse-list');
  el.innerHTML = list.map(c=>{
    const rp = getP(c.id,'recognize');
    let rCls='new', rMark='';
    if(rp && rp.box>=MASTER_BOX){ rCls='mastered'; rMark='✓'; }
    else if(rp){ rCls='learning'; }

    let sCls='locked', sMark='', sTitle='読み未習得';
    if(isUnlockedForSpell(c.id)){
      const sp = getP(c.id,'spell');
      if(sp && sp.box>=MASTER_BOX){ sCls='mastered'; sMark='✓'; sTitle='定着'; }
      else if(sp){ sCls='learning'; sTitle='学習中'; }
      else { sCls='new'; sTitle='未学習'; }
    }

    return `<div class="word-row" onclick="toggleDetail(${c.id})">
      <div class="dual-icons">
        <div class="di"><span class="box-icon ${rCls}">${rMark}</span><span class="di-label">読</span></div>
        <div class="di"><span class="box-icon ${sCls}" title="${sTitle}">${sMark}</span><span class="di-label">書</span></div>
      </div>
      <div class="wtext">
        <span class="en">${c.w}</span><span class="pos">${c.pos}</span>
        <div class="jp">${c.m}</div>
        <div class="word-detail" id="detail-${c.id}">
          <div class="ex">${c.ex}</div>
          <div class="exja">${c.exja}</div>
          <button class="speak-btn" onclick="event.stopPropagation();speak('${escAttr(c.w)}','en-US')">🔊 単語</button>
          <button class="speak-btn" onclick="event.stopPropagation();speak('${escAttr(c.ex)}','en-US')">🔊 例文</button>
        </div>
      </div>
    </div>`;
  }).join('');
}
function toggleDetail(id){
  const d = document.getElementById('detail-'+id);
  const open = d.classList.contains('open');
  document.querySelectorAll('.word-detail.open').forEach(x=>x.classList.remove('open'));
  if(!open) d.classList.add('open');
}

/* ============ 初期化 ============ */
document.querySelectorAll('.tab-btn').forEach(b=>{
  b.addEventListener('click', ()=>showScreen(b.dataset.screen));
});
document.getElementById('btn-start-recognize').addEventListener('click', ()=>startStudy('recognize'));
document.getElementById('btn-start-spell').addEventListener('click', ()=>startStudy('spell'));
document.getElementById('btn-goto-browse').addEventListener('click', ()=>showScreen('browse'));
document.getElementById('search-input').addEventListener('input', (e)=>renderBrowse(e.target.value));
document.getElementById('btn-reset').addEventListener('click', ()=>{
  if(confirm('本当にすべての学習進捗をリセットしますか？この操作は元に戻せません。')){
    progress = {};
    saveProgress();
    renderHome();
  }
});

(function init(){
  loadProgress();
  renderHome();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.log('SW registration failed', e));
  });
}
</script>
